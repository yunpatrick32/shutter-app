# Redirect old Netlify subdomain to new custom domain
[[redirects]]
  from = "https://shutter-app.netlify.app/*"
  to = "https://shutterfind.app/:splat"
  status = 301
  force = true

# SPA fallback — serve index.html for all routes (enables /start?src=ig_ad)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
